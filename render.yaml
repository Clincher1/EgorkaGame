# Деплой на Render.com (бесплатный тариф Web Service) под VK Mini App.
# В дашборде: New + → Blueprint → подключить репозиторий → выбрать этот файл.
# Значения с sync: false вводятся вручную в дашборде (секреты не в git).
services:
  - type: web
    name: egor-pto-game
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # ID приложения из dev.vk.com — не секрет, лежит в манифесте открыто.
      - key: VK_APP_ID
        value: "54850918"
      # Защищённый ключ приложения: Настройки → Разработка → Защищённый ключ.
      - key: VK_SECRET
        generateValue: false
        sync: false
      # Мягкая монетизация и цензура для каталога VK.
      - key: CENSOR_MODE
        value: symbols
      - key: PERMADEATH
        value: "false"
      # Render сам подставляет PORT; веб-режим без Telegram-бота.
      - key: BOT_TOKEN
        sync: false
